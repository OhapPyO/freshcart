services:
  order-service:
     build:
      context: ./order-service
      dockerfile: Dockerfile

     depends_on:
        postgres:
          condition: service_healthy

     environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/freshcart
        SPRING_DATASOURCE_USERNAME: freshcart
        SPRING_DATASOURCE_PASSWORD: ${password}
        JWT_SECRET: ${JWT_SECRET}
     ports:
       - "8080:8080"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: freshcart
      POSTGRES_USER: freshcart
      POSTGRES_PASSWORD: ${password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshcart -d freshcart"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  kafka:
      image: apache/kafka-native:4.4.0
      healthcheck:
        test: "bash -c 'echo > /dev/tcp/127.0.0.1/9092; exit $?;'"
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 30s
      ports:
        - "9092:9092"
      environment:
        # Configure listeners for both docker and host communication
        KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
        KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT

        # Settings required for KRaft mode
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091

        # Listener to use for broker-to-broker communication
        KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

        # Required for a single node cluster
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
